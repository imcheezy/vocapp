<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Tells phones "render at real device width", not zoomed-out desktop width. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>生词 — HSK Flashcards</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400;500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="screen">

    <!--
      Three screens now. All three live in the page at all times; CSS shows one
      and hides the others based on a class on <body>. There is no page
      navigation and no framework — a "screen" is a section that is visible.
    -->

    <!-- ==================== HOME ==================== -->
    <section class="view view--home">

      <header class="brand">
        <h1 class="brand__name">生词</h1>
        <p class="brand__sub">HSK 3.0 vocabulary</p>
      </header>

      <p class="stat">
        <span class="stat__n" id="statStudied">0</span>
        <span class="stat__label">studied</span>
        <span class="stat__dot">·</span>
        <span class="stat__n stat__n--quiet" id="statWords">0</span>
        <span class="stat__label">selected</span>
      </p>

      <p class="eyebrow">LEVELS</p>

      <!--
        Real <input type="checkbox"> elements inside <label>s, not styled divs.
        Same lesson as the card being a <button> in Slice 1: the native element
        already knows how to be focused, toggled with the keyboard, and
        announced correctly. The inputs are visually hidden but still present,
        so all of that keeps working — CSS just draws a nicer box on top.
      -->
      <div class="levels" id="levels">

        <label class="level">
          <input type="checkbox" name="level" value="1" checked>
          <span class="level__box"><svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg></span>
          <span class="level__name">HSK 1</span>
          <span class="level__count">506</span>
        </label>

        <label class="level">
          <input type="checkbox" name="level" value="2">
          <span class="level__box"><svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg></span>
          <span class="level__name">HSK 2</span>
          <span class="level__count">750</span>
        </label>

        <label class="level">
          <input type="checkbox" name="level" value="3">
          <span class="level__box"><svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg></span>
          <span class="level__name">HSK 3</span>
          <span class="level__count">953</span>
        </label>

        <label class="level">
          <input type="checkbox" name="level" value="4">
          <span class="level__box"><svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg></span>
          <span class="level__name">HSK 4</span>
          <span class="level__count">972</span>
        </label>

      </div>

      <p class="eyebrow">DIRECTION</p>

      <!-- Radio buttons, for the same reason: only one can be chosen, and
           arrow keys move between them without a line of JavaScript. -->
      <div class="segmented" id="direction" role="radiogroup" aria-label="Study direction">
        <label class="seg">
          <input type="radio" name="direction" value="cn2en" checked>
          <span class="seg__label">中 → EN</span>
        </label>
        <label class="seg">
          <input type="radio" name="direction" value="en2cn">
          <span class="seg__label">EN → 中</span>
        </label>
        <label class="seg">
          <input type="radio" name="direction" value="mixed">
          <span class="seg__label">Mixed</span>
        </label>
      </div>

      <div class="spacer"></div>

      <p class="warn" id="noLevels">Choose at least one level.</p>

      <button class="btn btn--primary" id="startBtn" type="button">
        Start <span class="btn__sub">20 cards</span>
      </button>

    </section>

    <!-- ==================== STUDY ==================== -->
    <section class="view view--study">

      <!-- How far through the session you are. Decorative for screen readers:
           the card itself announces its own position. -->
      <div class="progress" aria-hidden="true">
        <div class="progress__fill" id="progressFill"></div>
      </div>

      <button class="card" id="card" type="button">

        <!-- FRONT: the prompt. Which of these two shows depends on the
             direction of this card — see the dir- classes in style.css. -->
        <div class="card__face card__face--front">
          <div class="hanzi" id="frontHanzi"></div>
          <div class="prompt" id="frontPrompt"></div>
        </div>

        <!-- BACK: the answer. -->
        <div class="card__face card__face--back">
          <div class="hanzi hanzi--small" id="backHanzi"></div>
          <div class="pinyin" id="backPinyin"></div>
          <div class="rule"></div>
          <div class="english" id="backEnglish"></div>
          <div class="pos" id="backPos"></div>
        </div>

      </button>

      <div class="tray">
        <p class="hint" id="hint">tap to reveal</p>

        <div class="grade">
          <button class="btn btn--missed" id="missedBtn" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            Missed it
          </button>
          <button class="btn btn--got" id="gotBtn" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>
            Got it
          </button>
        </div>
      </div>

    </section>

    <!-- ==================== SUMMARY ==================== -->
    <section class="view view--summary">

      <p class="eyebrow">SESSION COMPLETE</p>

      <p class="score">
        <span class="score__correct" id="scoreCorrect">0</span>
        <span class="score__total">of <span id="scoreTotal">0</span> correct</span>
      </p>

      <div class="progress" aria-hidden="true">
        <div class="progress__fill" id="scoreFill"></div>
      </div>

      <div class="review" id="review">
        <div class="review__head">
          <span class="eyebrow">REVIEW THESE</span>
          <span class="review__count" id="missedCount"></span>
        </div>
        <!-- Filled in by app.js. A <ul> because it genuinely is a list. -->
        <ul class="missed" id="missedList"></ul>
      </div>

      <p class="perfect" id="perfect">Nothing missed. 很好.</p>

      <div class="spacer"></div>

      <div class="actions">
        <button class="btn btn--primary" id="againBtn" type="button">Study again</button>
        <button class="btn btn--ghost" id="homeBtn" type="button">Home</button>
      </div>

    </section>

  </main>

  <!--
    The word lists. Plain <script> tags, not fetch() — see the note at the top
    of app.js for why. Each file adds itself to window.HSK, so app.js finds all
    four levels already in memory when it starts.
  -->
  <script src="data/hsk3-L1.js"></script>
  <script src="data/hsk3-L2.js"></script>
  <script src="data/hsk3-L3.js"></script>
  <script src="data/hsk3-L4.js"></script>

  <!-- Loaded last, so every element above already exists when the script runs. -->
  <script src="app.js"></script>
</body>
</html>
